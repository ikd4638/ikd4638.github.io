name: Update ADS Publications

on:
workflow_dispatch:

permissions:
contents: write

jobs:
update:
runs-on: ubuntu-latest

```
steps:
  - uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install requests
    run: pip install requests

  - name: Run ADS updater
    env:
      ADS_API_TOKEN: ${{ secrets.ADS_API_TOKEN }}
    run: python scripts/update_ads.py
```

