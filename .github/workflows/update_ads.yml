name: Update ADS Publications

on:

workflow_dispatch:

schedule:
- cron: "0 2 * * *"

permissions:
contents: write

jobs:

update:

```
runs-on: ubuntu-latest

steps:

  - uses: actions/checkout@v4

  - uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - run: |
      pip install requests

  - run: |
      python scripts/update_ads.py
    env:
      ADS_API_TOKEN: ${{ secrets.ADS_API_TOKEN }}

  - name: Commit changes
    run: |

      git config user.name github-actions
      git config user.email github-actions@github.com

      git add data

      git diff --cached --quiet || \
      git commit -m "Update ADS data"

      git push
```

